<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="dbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F5F9FF"/><stop offset="1" stop-color="#E7F0FC"/>
    </linearGradient>
    <linearGradient id="dbody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F2F6FD"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" fill="url(#dbg)"/>
  <!-- soft ground shadow -->
  <ellipse cx="50" cy="82" rx="29" ry="5.5" fill="#0F1742" opacity="0.08"/>
  <!-- fastening tabs -->
  <rect x="11" y="35" width="15" height="12" rx="3.5" fill="#FFFFFF" stroke="#D9E4F5" stroke-width="1.2"/>
  <rect x="74" y="35" width="15" height="12" rx="3.5" fill="#FFFFFF" stroke="#D9E4F5" stroke-width="1.2"/>
  <!-- diaper body -->
  <path d="M24,32 H76 a4,4 0 0 1 4,4 v8 c0,18 -12,30 -30,37 c-18,-7 -30,-19 -30,-37 v-8 a4,4 0 0 1 4,-4 Z"
        fill="url(#dbody)" stroke="#D9E4F5" stroke-width="1.6"/>
  <!-- leg-cuff curves -->
  <path d="M27,49 C35,57 37,66 35,75" fill="none" stroke="#E3EBF7" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M73,49 C65,57 63,66 65,75" fill="none" stroke="#E3EBF7" stroke-width="2.2" stroke-linecap="round"/>
  <!-- waistband -->
  <path d="M24,32 H76 a4,4 0 0 1 4,4 v3.5 H20 v-3.5 a4,4 0 0 1 4,-4 Z" fill="#6B96E8"/>
  <!-- cute pattern dots -->
