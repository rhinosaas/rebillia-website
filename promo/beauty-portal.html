<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rebillia · Beauty Subscription Promo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --accent:#C02772; --tint:#FBE9F2;
    --navy:#0F1742; --navy2:#1A2B5C; --muted:#9CA7B6;
    --border:#E7ECF6; --row:#F6F8FD;
    --green:#10B981; --green-d:#0A8F65;
  }
  *{box-sizing:border-box; margin:0; padding:0}
  html,body{height:100%}
  body{
    font-family:'DM Sans',-apple-system,BlinkMacSystemFont,sans-serif;
    color:var(--navy); background:transparent;
    display:flex; align-items:center; justify-content:center; overflow:hidden;
  }
  .fit{width:100vw; height:100vh; display:flex; align-items:center; justify-content:center}
  .stage{
    position:relative; width:1280px; height:720px; flex:none;
    transform-origin:center center;
  }

  /* ── floating chips ── */
  .chip{
    position:absolute; display:flex; align-items:center; gap:10px;
    background:#fff; border:1px solid var(--border); border-radius:24px; padding:11px 20px;
    font-size:19px; font-weight:600; color:var(--navy2);
    box-shadow:0 12px 28px rgba(15,23,66,.12); z-index:3;
    transition:transform .35s cubic-bezier(.34,1.56,.64,1), box-shadow .35s;
  }
  .chip__d{
    width:28px; height:28px; border-radius:50%; flex:none;
    background:var(--tint); color:var(--accent);
    display:flex; align-items:center; justify-content:center; font-size:16px;
  }
  .chip--tl{ left:452px; top:150px; }
  .chip--bl{ left:440px; top:520px; }
  .chip--tr{ right:26px; top:150px; }
  .chip--br{ right:30px; top:520px; }

  /* left copy panel (rotates per control) */
  .copy{ position:absolute; left:74px; top:50%; transform:translateY(-50%); width:396px; height:238px; z-index:4; }
  .slide{ position:absolute; left:0; right:0; top:0; opacity:0; transform:translateY(14px); transition:opacity .5s ease, transform .5s ease; }
  .slide.on{ opacity:1; transform:none; }
  .eyebrow{ display:inline-flex; align-items:center; gap:9px; padding:8px 16px; border-radius:999px;
    background:var(--tint); color:var(--accent); font-size:13px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; }
  .eyebrow i{ width:8px; height:8px; border-radius:50%; background:var(--accent); flex:none; }
  .headline{ font-family:'Outfit',sans-serif; font-weight:800; font-size:46px; line-height:1.09; letter-spacing:-.02em; color:var(--navy); margin-top:20px; }
  .headline span{ color:var(--accent); }
  .chip.pop{ transform:translateY(-8px) scale(1.06); box-shadow:0 22px 44px rgba(192,39,114,.28); border-color:var(--accent); }
  .chip.pop .chip__d{ background:var(--accent); color:#fff; }

  /* ── portal card ── */
  .card{
    position:absolute; left:648px; top:50%; transform:translateY(-50%);
    width:412px; background:#fff; border:1px solid var(--border); border-radius:26px;
    padding:24px; box-shadow:0 30px 64px rgba(15,23,66,.16); z-index:2;
    transition:transform .5s cubic-bezier(.4,0,.2,1);
  }
  .card.zoom{ transform:translateY(-50%) scale(1.03); }

  .head{ display:flex; align-items:center; gap:15px; margin-bottom:20px; }
  .badge{
    width:50px; height:50px; border-radius:15px; flex:none;
    background:var(--accent); color:#fff; display:flex; align-items:center; justify-content:center;
    font-family:'Outfit',sans-serif; font-weight:800; font-size:23px;
  }
  .htitle{ font-size:20px; font-weight:700; color:var(--navy); line-height:1.2; }
  .htitle small{ display:block; font-weight:500; font-size:14.5px; color:var(--muted); margin-top:2px; }
  .status{
    margin-left:auto; display:inline-flex; align-items:center; gap:7px;
    font-size:14px; font-weight:700; color:var(--green-d);
    background:rgba(16,185,129,.12); padding:7px 13px; border-radius:999px;
  }
  .status i{ width:8px; height:8px; border-radius:50%; background:var(--green); display:inline-block; }

  .row{
    position:relative; display:flex; align-items:center; gap:14px;
    background:var(--row); border-radius:15px; padding:13px 15px; margin-top:13px;
    transition:background .25s, box-shadow .25s;
  }
  .row.hi{ background:var(--tint); box-shadow:0 0 0 2px var(--accent) inset; }
  .row__ic{
    width:38px; height:38px; border-radius:10px; flex:none;
    background:var(--tint); color:var(--accent);
    display:flex; align-items:center; justify-content:center;
  }
  .row__label{ font-size:16.5px; font-weight:600; color:var(--navy2); }
  .row__txt{ flex:1; display:flex; flex-direction:column; justify-content:center; min-width:0; }
  .row__note{ font-size:12.5px; font-weight:600; color:var(--accent); height:0; opacity:0; margin-top:0; overflow:hidden; white-space:nowrap; transition:height .28s ease, opacity .28s ease, margin-top .28s ease; }
  .row.on .row__note{ height:16px; opacity:1; margin-top:3px; }
  .pill{
    font-size:14px; font-weight:700; color:var(--accent);
    background:var(--tint); padding:6px 15px; border-radius:12px; white-space:nowrap;
    display:inline-flex; align-items:center; gap:7px;
    transition:transform .18s;
  }
  .pill-photo,
  .opt-photo{
    flex:none; border-radius:8px; background-image:url('img/beauty-shades-sheet.webp');
    background-size:200% 200%; background-repeat:no-repeat; background-color:#F6E9E4;
    box-shadow:inset 0 0 0 1px rgba(15,23,66,.08);
  }
  .pill-photo{ width:26px; height:26px; margin:-3px 1px -3px -7px; }
  .opt-photo{ width:34px; height:34px; }
  .photo-1{ background-position:0 0; }
  .photo-2{ background-position:100% 0; }
  .photo-3{ background-position:0 100%; }
  .photo-4{ background-position:100% 100%; }
  .pill svg{ opacity:.8; }
  .pill.flash{ animation:pillflash .5s ease; }
  @keyframes pillflash{ 0%{transform:scale(.9); opacity:.4} 55%{transform:scale(1.08)} 100%{transform:scale(1)} }

  /* toggle switch */
  .switch{ position:relative; width:52px; height:29px; flex:none; }
  .switch input{ position:absolute; inset:0; opacity:0; margin:0; }
  .switch span{ position:absolute; inset:0; background:#CBD5E6; border-radius:999px; transition:background .28s; }
  .switch span::after{
    content:""; position:absolute; top:3px; left:3px; width:23px; height:23px;
    border-radius:50%; background:#fff; box-shadow:0 1px 4px rgba(0,0,0,.25); transition:transform .28s cubic-bezier(.34,1.56,.64,1);
  }
  .switch input:checked + span{ background:var(--accent); }
  .switch input:checked + span::after{ transform:translateX(23px); }

  /* shade dropdown */
  .drop{
    position:absolute; right:15px; top:calc(100% - 4px); z-index:6; width:206px;
    background:#fff; border:1px solid var(--border); border-radius:14px; padding:7px;
    box-shadow:0 22px 48px rgba(15,23,66,.20);
    opacity:0; transform:translateY(-8px) scale(.97); transform-origin:top right;
    pointer-events:none; transition:opacity .22s ease, transform .22s ease;
  }
  .drop.open{ opacity:1; transform:none; }
  .opt{
    display:flex; align-items:center; gap:11px; padding:10px 12px; border-radius:10px;
    font-size:15px; font-weight:600; color:var(--navy2); transition:background .16s;
  }
  .opt .sw{ width:18px; height:18px; border-radius:50%; flex:none; box-shadow:inset 0 0 0 1px rgba(0,0,0,.06); }
  .opt .opt-img{ width:34px; height:34px; flex:none; display:flex; align-items:center; justify-content:center; }
  .opt .opt-img svg{ display:block; }
  .opt.sel, .opt.hi{ background:var(--tint); color:var(--accent); }
  .opt .chk{ margin-left:auto; opacity:0; color:var(--accent); }
  .opt.sel .chk{ opacity:1; }

  .save{
    margin-top:19px; width:100%; padding:15px 0; border:0; border-radius:14px;
    background:var(--accent); color:#fff;
    font-family:'DM Sans',sans-serif; font-size:16px; font-weight:700; letter-spacing:.01em;
    display:flex; align-items:center; justify-content:center; gap:9px;
    transition:background .3s, transform .12s;
  }
  .save.press{ transform:scale(.975); }
  .save.done{ background:var(--green); }
  .save .chk{ width:0; overflow:hidden; opacity:0; transition:width .3s, opacity .3s; display:inline-flex; }
  .save.done .chk{ width:20px; opacity:1; }

  /* cursor */
  .cursor{
    position:absolute; left:640px; top:600px; width:30px; height:30px; z-index:10;
    margin-left:-4px; margin-top:-2px; pointer-events:none;
    transition:left .8s cubic-bezier(.5,0,.2,1), top .8s cubic-bezier(.5,0,.2,1), transform .12s;
    filter:drop-shadow(0 3px 5px rgba(15,23,66,.3));
  }
  .cursor.tap{ transform:scale(.82); }
  .ring{
    position:absolute; left:0; top:0; width:34px; height:34px; margin:-17px 0 0 -17px;
    border-radius:50%; border:2px solid var(--accent); z-index:9; pointer-events:none;
    opacity:0; transform:scale(.3);
  }
  .ring.go{ animation:ring .55s ease-out; }
  @keyframes ring{ 0%{opacity:.7; transform:scale(.3)} 100%{opacity:0; transform:scale(1.5)} }

  /* end message */
  .endmsg{
    position:absolute; left:50%; bottom:40px; transform:translate(-50%,14px);
    z-index:11; opacity:0; transition:opacity .55s ease, transform .55s ease;
    font-family:'Outfit',sans-serif; font-weight:700; font-size:26px; color:var(--navy);
    text-align:center; white-space:nowrap;
  }
  .endmsg.show{ opacity:1; transform:translate(-50%,0); }
  .endmsg b{ color:var(--accent); font-weight:700; }
</style>
</head>
<body>
<div class="fit">
  <div class="stage" id="stage">

    <div class="copy">
      <div class="slide"><span class="eyebrow"><i></i>SWITCH THE SHADE</span><h2 class="headline">New shade in <span>seconds.</span></h2></div>
      <div class="slide"><span class="eyebrow"><i></i>FRAGRANCE-FREE</span><h2 class="headline">Kinder on <span>sensitive skin.</span></h2></div>
      <div class="slide"><span class="eyebrow"><i></i>ADD SPF 30</span><h2 class="headline">Sun protection, <span>added on.</span></h2></div>
    </div>


    <div class="card" id="card">
      <div class="head">
        <span class="badge">R</span>
        <span class="htitle">Subscription<small>Manage your routine</small></span>
        <span class="status"><i></i>Active</span>
      </div>

      <div class="row" id="rowShade">
        <span class="row__ic"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.7l5.7 5.7a8 8 0 11-11.4 0z"/></svg></span>
        <span class="row__label">Shade</span>
        <span class="pill" id="shadePill"><span class="pill-photo photo-1" id="shadePillPhoto" aria-hidden="true"></span><span id="shadePillLabel">Warm 03</span></span>

        <div class="drop" id="drop">
          <div class="opt sel" data-shade="Warm 03" data-photo="photo-1"><span class="opt-photo photo-1" aria-hidden="true"></span>Warm 03<span class="chk"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span></div>
          <div class="opt" data-shade="Neutral 04" data-photo="photo-2"><span class="opt-photo photo-2" aria-hidden="true"></span>Neutral 04<span class="chk"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span></div>
          <div class="opt" data-shade="Cool 02" data-photo="photo-3"><span class="opt-photo photo-3" aria-hidden="true"></span>Cool 02<span class="chk"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span></div>
          <div class="opt" data-shade="Deep 06" data-photo="photo-4"><span class="opt-photo photo-4" aria-hidden="true"></span>Deep 06<span class="chk"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span></div>
        </div>
      </div>

      <label class="row" id="rowFrag">
        <span class="row__ic"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/></svg></span>
        <span class="row__txt"><span class="row__label">Fragrance-free</span><span class="row__note">Better for sensitive skin</span></span>
        <span class="switch"><input type="checkbox" id="swFrag" aria-label="Fragrance-free"><span></span></span>
      </label>

      <label class="row" id="rowSpf">
        <span class="row__ic"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></span>
        <span class="row__txt"><span class="row__label">Add SPF 30</span><span class="row__note">Daily sun protection added</span></span>
        <span class="switch"><input type="checkbox" id="swSpf" aria-label="Add SPF 30"><span></span></span>
      </label>

      <button class="save" id="save" type="button">
        <span class="chk"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span>
        <span id="saveTxt">Save changes</span>
      </button>
    </div>

    <div class="ring" id="ring"></div>
    <svg class="cursor" id="cursor" viewBox="0 0 24 24" fill="#0F1742" stroke="#fff" stroke-width="1.4" stroke-linejoin="round"><path d="M5 2l14 9-6 1.5L16 20l-3 1.3-3-7.4L5 18z"/></svg>

    <div class="endmsg" id="endmsg">Subscriptions that <b>adapt to every customer.</b></div>
  </div>
</div>

<script>
(function(){
  var stage=document.getElementById('stage');
  var cursor=document.getElementById('cursor'), ring=document.getElementById('ring');
  var rowShade=document.getElementById('rowShade'), drop=document.getElementById('drop');
  var shadePill=document.getElementById('shadePill'), shadePillLabel=document.getElementById('shadePillLabel'), shadePillPhoto=document.getElementById('shadePillPhoto');
  var swFrag=document.getElementById('swFrag'), swSpf=document.getElementById('swSpf');
  var save=document.getElementById('save'), saveTxt=document.getElementById('saveTxt');
  var card=document.getElementById('card');
  var endmsg=document.getElementById('endmsg');
  var opts=drop.querySelectorAll('.opt');
  var slides=document.querySelectorAll('.slide');
  function showSlide(i){ slides.forEach(function(s,k){ s.classList.toggle('on', k===i); }); }

  /* fit stage to viewport (letterbox-free, keeps 16:9) */
  function fit(){
    var s=Math.min(window.innerWidth/1280, window.innerHeight/720);
    stage.style.transform='scale('+s+')';
  }
  window.addEventListener('resize',fit); fit();

  function scale(){ return stage.getBoundingClientRect().width/1280; }
  function moveTo(el,ox,oy){
    var s=scale(), sr=stage.getBoundingClientRect(), r=el.getBoundingClientRect();
    var x=(r.left-sr.left)/s + r.width/(2*s) + (ox||0);
    var y=(r.top-sr.top)/s + r.height/(2*s) + (oy||0);
    cursor.style.left=x+'px'; cursor.style.top=y+'px';
  }
  function tap(){
    cursor.classList.add('tap'); setTimeout(function(){cursor.classList.remove('tap');},140);
    ring.style.left=(parseFloat(cursor.style.left)+2)+'px';
    ring.style.top=(parseFloat(cursor.style.top)+2)+'px';
    ring.classList.remove('go'); void ring.offsetWidth; ring.classList.add('go');
  }

  var timers=[];
  function at(t,fn){ timers.push(setTimeout(fn,t)); }

  function reset(){
    timers.forEach(clearTimeout); timers=[];
    stage.querySelectorAll('.row, .slide').forEach(function(r){ r.classList.remove('on'); });
    cursor.style.left='640px'; cursor.style.top='600px';
    rowShade.classList.remove('hi'); drop.classList.remove('open');
    shadePillLabel.textContent='Warm 03'; shadePillPhoto.className='pill-photo photo-1'; shadePill.classList.remove('flash');
    opts.forEach(function(o){ o.classList.remove('sel','hi'); });
    opts[0].classList.add('sel');
    swFrag.checked=false; swSpf.checked=false;
    
    save.classList.remove('press','done'); saveTxt.textContent='Save changes';
    card.classList.remove('zoom'); endmsg.classList.remove('show');
  }

  function run(){
    reset();

    at(360, function(){ showSlide(0); });
    at(5040, function(){ showSlide(1); });
    at(6960, function(){ showSlide(2); });

    /* 0–2s : reveal, cursor to shade field, highlight */
    at(600, function(){ moveTo(shadePill); });
    at(1740, function(){ rowShade.classList.add('hi'); });

    /* 2–4s : click shade, dropdown, pick Neutral 04 */
    at(2400, function(){ tap(); drop.classList.add('open'); });
    at(3480, function(){ moveTo(opts[1]); });
    at(3900, function(){ opts[1].classList.add('hi'); });
    at(4260, function(){
      tap();
      opts.forEach(function(o){ o.classList.remove('sel','hi'); });
      opts[1].classList.add('sel');
      shadePillLabel.textContent='Neutral 04'; shadePillPhoto.className='pill-photo '+opts[1].dataset.photo; shadePill.classList.remove('flash'); void shadePill.offsetWidth; shadePill.classList.add('flash');
    });
    at(4740, function(){ drop.classList.remove('open'); rowShade.classList.remove('hi'); });

    /* 4–6s : fragrance-free toggle ON */
    at(5160, function(){ moveTo(swFrag); });
    at(6000, function(){ tap(); swFrag.checked=true; swFrag.closest('.row').classList.add('on'); });

    /* 6–8s : add SPF toggle ON, then highlight partner bundle */
    at(6840, function(){ moveTo(swSpf); });
    at(7620, function(){ tap(); swSpf.checked=true; swSpf.closest('.row').classList.add('on'); });

    /* 8–10s : save + success, end message */
    at(9480, function(){ moveTo(save,0,0); });
    at(10320, function(){
      tap(); save.classList.add('press'); card.classList.add('zoom');
      setTimeout(function(){ save.classList.remove('press'); },160);
    });
    at(10680, function(){ save.classList.add('done'); saveTxt.textContent='Subscription updated'; });
    at(11040, function(){ card.classList.remove('zoom'); });
    at(11400, function(){ endmsg.classList.add('show'); });

    /* loop */
    at(12000, run);
  }

  if(document.readyState==='complete') run();
  else window.addEventListener('load', function(){ setTimeout(run,200); });
})();
</script>
</body>
</html>
